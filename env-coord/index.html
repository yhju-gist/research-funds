?","측정값에 설명하기 어려운 부분이 있어요. 이번엔 어떻게 풀까요?":"Có những giá trị đo khó giải thích. Lần này bạn sẽ giải quyết thế nào?","측정과 현장 조사는 기후·물·생태 연구 모두의 출발점이 됩니다.":"Đo lường và khảo sát thực địa là điểm khởi đầu của mọi nghiên cứu về khí hậu, nước và sinh thái.","캘린더에 담기":"Thêm vào lịch","컴퓨터 모델로 기후·대기 시뮬레이션":"Mô phỏng khí hậu & khí quyển bằng mô hình máy tính","컴퓨터 속 지구는 실제 지구를 얼마나 닮을 수 있나요?":"Trái Đất trong máy tính có thể giống Trái Đất thật đến mức nào?","코스트리 분야":"Lĩnh vực cây môn học","코스트리는 학과가 분야별로 정리한 권장 이수 흐름이고, ★ 표시는 고른 출발점과 가까운 과목을 이 페이지에서 골라 본 예시예요. 코스트리는 수강신청 참고자료이니, 학기별 개설 여부와 수강 조건은 수강신청 안내문을 확인해 주세요.":"Cây môn học là lộ trình học được khoa khuyến nghị theo từng lĩnh vực, còn dấu ★ là các môn mà trang này chọn ra là gần với điểm xuất phát của bạn. Cây môn học chỉ để tham khảo khi đăng ký, vui lòng xem thông báo đăng ký môn học mỗi học kỳ về việc mở lớp và điều kiện học.","탄소·자원·물·에너지·생태가 도는 과정에서 나오는 데이터를 AI로 분석하고, 더 잘 순환하도록 설계하는 연구가 궁금해요.":"Tôi tò mò về nghiên cứu dùng AI phân tích dữ liệu từ quá trình tuần hoàn carbon, tài nguyên, nước, năng lượng, sinh thái và thiết kế để chúng tuần hoàn tốt hơn.","탄소·자원·물·에너지·생태가 버려지지 않고 다시 도는 순환경제. 희토류와 리튬 같은 귀한 자원을 되찾고, AI로 순환의 길을 설계하는 일에 끌렸어요. 학과는 AI 순환경제 특성화대학원을 운영하고 있어요.":"Kinh tế tuần hoàn, nơi carbon, tài nguyên, nước, năng lượng và sinh thái không bị bỏ đi mà quay vòng trở lại. Tôi bị cuốn hút bởi việc thu hồi tài nguyên quý như đất hiếm và lithium, và thiết kế con đường tuần hoàn bằng AI. Khoa đang vận hành Chương trình sau đại học chuyên sâu về Kinh tế tuần hoàn AI.","탄소·질소 동위원소나 수은·비소 같은 미량금속으로 물질과 먹이의 이동을 추적하는 연구가 궁금해요.":"Tôi tò mò về nghiên cứu truy vết sự di chuyển của vật chất và thức ăn bằng đồng vị carbon, nitơ hoặc kim loại vi lượng như thủy ngân, asen.","탄소를 줄이는 것과 다시 쓰는 것은 어떻게 함께 설계하나요?":"Giảm carbon và tái sử dụng carbon được thiết kế cùng nhau như thế nào?","탄소순환":"Chu trình carbon","탄소순환과 탄소 자원화":"Chu trình carbon và tái sử dụng carbon","탄소순환을 AI로 분석하고 예측해요. (대학원 특성화 과목)":"Phân tích và dự đoán chu trình carbon bằng AI. (Môn chuyên sâu sau đại học)","탄소에너지시스템 연구실":"Phòng thí nghiệm Hệ thống Năng lượng Carbon","탄소중립과 에너지기술개론":"Nhập môn trung hòa carbon và công nghệ năng lượng","탄소중립을 위해 이산화탄소를 어떻게 다시 쓸 수 있나요?":"Để trung hòa carbon, CO₂ có thể được tái sử dụng như thế nào?","테스트 링크 복사":"Sao chép liên kết bài kiểm tra","토양 속 미세플라스틱, 물속 미량금속, 생물의 대사 물질을 질량분석기로 정밀하게 찾아내는 연구가 궁금해요.":"Tôi tò mò về nghiên cứu dùng máy khối phổ để phát hiện chính xác vi nhựa trong đất, kim loại vi lượng trong nước và chất chuyển hóa trong sinh vật.","통계와 기계학습으로 환경 데이터를 다루고, 지구를 하나의 시스템으로 이해해요.":"Xử lý dữ liệu môi trường bằng thống kê và học máy, và hiểu Trái Đất như một hệ thống.","폭염·폭우 같은 극한 날씨가 왜 생기고, 지구온난화 속에서 앞으로 어떻게 달라질지 알고 싶어요.":"Tôi muốn biết vì sao thời tiết cực đoan như nắng nóng, mưa lớn xảy ra và sẽ thay đổi thế nào khi Trái Đất nóng lên.","핀을 누르면 그 출발점을 소개해요":"Bấm vào ghim để xem giới thiệu điểm xuất phát đó","하늘, 물, 생태, 에너지. 마음이 가는 곳을 골라 따라가면 그 자리에서 연구하는 교수님과 들을 수업을 알려드려요.":"Bầu trời, nước, sinh thái, năng lượng. Hãy chọn nơi trái tim bạn hướng tới, chúng tôi sẽ cho bạn biết các giáo sư nghiên cứu ở đó và những môn bạn có thể học.","하천·수자원·처리 공정을 데이터와 AI로 예측하고 더 똑똑하게 운영하는 연구가 궁금해요.":"Tôi tò mò về nghiên cứu dùng dữ liệu và AI để dự đoán sông ngòi, tài nguyên nước, quy trình xử lý và vận hành chúng thông minh hơn.","학과 교수진 ↗":"Giảng viên của khoa ↗","학과 인턴십 프로그램 공고를 확인하고, 이어서 학사논문연구 Ⅰ·Ⅱ로 내 연구를 정리해보세요.":"Hãy xem thông báo chương trình thực tập của khoa, sau đó tổng kết nghiên cứu của mình bằng Nghiên cứu luận văn cử nhân Ⅰ·Ⅱ.","학과 코스트리로 보기":"Xem cây môn học của khoa","학과 홈페이지 ↗":"Trang web của khoa ↗","학과·연구실 홈페이지의 공개 연구소개(#. #. #. 확인)로 만든 탐색용 연결이에요. 지금 진행 중인 연구와 학생 참여 기회는 교수님께 직접 여쭤보세요.":"Đây là liên kết khám phá được xây dựng từ phần giới thiệu nghiên cứu công khai trên trang web của khoa và phòng thí nghiệm (kiểm tra ngày #. #. #.). Hãy hỏi trực tiếp giáo sư về nghiên cứu đang thực hiện và cơ hội tham gia cho sinh viên.","학과는 BK# 교육연구단과 AI 순환경제 특성화대학원을 운영해요. 참여 방식과 지원 내용을 물어보세요.":"Khoa vận hành Nhóm giáo dục – nghiên cứu BK# và Chương trình sau đại học chuyên sâu về Kinh tế tuần hoàn AI. Hãy hỏi về cách tham gia và các hỗ trợ.","학과소개 자료(#. #.) 기준":"Theo tài liệu giới thiệu khoa (#. #.)","학과의 공식 연구분야는 물·생태, 기후·대기, 지속가능 에너지 세 갈래예요. 여기서는 물과 생태를 나누고 자원순환을 더했으며, 세 분야 모두에 쓰이는 AI·데이터와 측정·현장 조사를 따로 꺼냈어요.":"Khoa có ba lĩnh vực nghiên cứu chính thức: nước & sinh thái, khí hậu & khí quyển, và năng lượng bền vững. Ở đây, chúng tôi tách nước và sinh thái, thêm tuần hoàn tài nguyên, và tách riêng AI & dữ liệu cùng đo lường & khảo sát thực địa – được dùng trong cả ba lĩnh vực.","학년·전공은 결과 뒤 안내를 맞추는 데만 쓰고, 답은 이 화면을 닫으면 사라져요.":"Năm học và chuyên ngành chỉ dùng để điều chỉnh hướng dẫn sau kết quả, và câu trả lời sẽ biến mất khi bạn đóng màn hình này.","학년과 전공을 고른 뒤 출발점 → 세부 주제 → 첫 접근 방법 → 막혔을 때의 방법 순서로 고르고, 마지막에 더 알고 싶은 것을 골라요. 앞의 답을 바꾸면 그 답에 딸린 뒤 답은 지워져요.":"Sau khi chọn năm học và chuyên ngành, bạn chọn lần lượt điểm xuất phát → chủ đề chi tiết → cách tiếp cận đầu tiên → phương pháp khi bế tắc, cuối cùng là điều bạn muốn biết thêm. Nếu thay đổi câu trả lời trước, các câu trả lời phía sau phụ thuộc vào nó sẽ bị xóa.","학부 강의를 맡고 있어요":"Phụ trách giảng dạy bậc đại học","학부 연구":"Nghiên cứu bậc đại học","학부 졸업 후 바로 일하는 것과 대학원을 마치고 일하는 것은 무엇이 다른가요?":"Đi làm ngay sau khi tốt nghiệp đại học khác gì so với đi làm sau khi học xong sau đại học?","학부 졸업과 석사·박사 후 맡는 일의 범위가 어떻게 다른지 선배에게 들어보세요.":"Hãy nghe các anh chị khóa trước kể về phạm vi công việc khác nhau sau khi tốt nghiệp cử nhân so với thạc sĩ, tiến sĩ.","학부생으로 연구를 경험하고 싶어요":"Tôi muốn trải nghiệm nghiên cứu khi còn là sinh viên đại học","학부생으로 연구실 문 두드리기":"Gõ cửa phòng thí nghiệm khi còn là sinh viên","학부생이 이 연구실에 처음 오면 무엇부터 배우나요?":"Khi sinh viên đại học mới vào phòng thí nghiệm này, sẽ học gì trước tiên?","학부에서는 분리 원리와 지구 물질, 물리화학적 처리를 배우고, 대학원 AI 순환경제 특성화 과목으로 이어갈 수 있어요.":"Ở bậc đại học bạn học nguyên lý tách, vật chất Trái Đất và xử lý hóa lý, rồi có thể tiếp tục với các môn chuyên sâu về kinh tế tuần hoàn AI ở bậc sau đại học.","학부연구로 맞는지 살펴보고, 대학원 모집 공고와 오픈랩 안내를 확인하세요.":"Hãy xem nghiên cứu có hợp với bạn không qua nghiên cứu bậc đại học, và theo dõi thông báo tuyển sinh sau đại học cũng như thông tin phòng thí nghiệm mở.","학사논문연구Ⅰ":"Nghiên cứu luận văn cử nhân Ⅰ","학사논문연구Ⅰ·Ⅱ":"Nghiên cứu luận văn cử nhân Ⅰ·Ⅱ","학사논문연구Ⅱ":"Nghiên cứu luận văn cử nhân Ⅱ","학위별 차이 비교하기":"So sánh khác biệt giữa các bậc học","한 번 쓴 물을 다시 쓰려면 무엇을 얼마나 걸러야 하나요?":"Để tái sử dụng nước đã dùng, cần lọc bỏ những gì và đến mức nào?","한승희":"Seunghee Han","해수담수화 공학":"Kỹ thuật khử mặn nước biển","해양 생태":"Sinh thái biển","해양 생태계":"Hệ sinh thái biển","해양 생태계·식물·외래종·환경 미생물·독성·생태 복원":"Hệ sinh thái biển · thực vật · loài ngoại lai · vi sinh vật môi trường · độc tính · phục hồi sinh thái","해양 연구는 기후와, 미생물 연구는 바이오에너지와, 독성 연구는 물·분석 연구와 이어집니다.":"Nghiên cứu biển gắn với khí hậu, nghiên cứu vi sinh vật gắn với năng lượng sinh học, và nghiên cứu độc tính gắn với nghiên cứu nước & phân tích.","해초지·인공 어초를 만들거나 외래종을 관리해 망가진 생태계를 회복시키는 연구가 궁금해요.":"Tôi tò mò về nghiên cứu phục hồi hệ sinh thái bị tổn hại bằng cách tạo thảm cỏ biển, rạn nhân tạo hoặc quản lý loài ngoại lai.","행정동 CT아트홀":"Tòa Hành chính, hội trường CT Art Hall","허호길":"Hor-Gil Hur","현장 관측":"Quan trắc thực địa","현장 관측·조사":"Quan trắc & Khảo sát thực địa","현장 조사와 실험실 분석은 어떻게 이어지나요?":"Khảo sát thực địa và phân tích trong phòng thí nghiệm kết nối với nhau như thế nào?","현장 조사와 질량분석으로 찾고 거동 모델링으로 정량화":"Phát hiện bằng khảo sát thực địa và khối phổ, định lượng bằng mô hình hóa hành vi","현장실습(여름)":"Thực tập thực địa (mùa hè)","현장실습과 전공연구에서 바다·하천·숲의 연구 현장을 경험해볼 수 있어요.":"Qua thực tập thực địa và nghiên cứu chuyên ngành, bạn có thể trải nghiệm hiện trường nghiên cứu ở biển, sông và rừng.","현장에 나가 시료와 데이터를 모은다":"Ra thực địa thu thập mẫu và dữ liệu","현장에 다시 나가 범위를 넓힌다":"Quay lại thực địa và mở rộng phạm vi","현장에는 얼마나 자주 나가나요? 학부생도 따라갈 수 있나요?":"Bao lâu thì đi thực địa một lần? Sinh viên đại học có thể đi cùng không?","현장에서 모은 시료가 실험실 결과와 다를 땐 어떻게 하나요?":"Khi mẫu lấy ở th  let html;
 if(area==='mine'){const first=rows.filter(f=>f.inFirstGroup);html=`<p class="fcount">먼저 찾아가 볼 교수님 ${first.length}분<span>주요 연구 먼저 · 같은 묶음은 무작위</span></p><div class="fac">${first.map(card).join('')}</div><details class="more"><summary>전체 교수님 ${FACULTY.length}분 보기</summary><div class="fac">${sorted.map(f=>card(rows.find(x=>x.id===f.id))).join('')}</div></details><div class="roster" aria-label="전체 교수님 명단">${sorted.map(f=>`<span${first.some(p=>p.id===f.id)?' class="on"':''}>${f.name}</span>`).join('')}</div>`;}
 else if(area==='all'){html=`<p class="fcount">전체 교수님 ${FACULTY.length}분<span>가나다순</span></p><div class="fac">${sorted.map(f=>card(rows.find(x=>x.id===f.id))).join('')}</div>`;}
 else{const shown=rows.filter(f=>f.level>0);html=`<p class="fcount">${areaById(area).name}와 이어지는 교수님 ${shown.length}분<span>주요 연결 먼저</span></p><div class="fac">${shown.map(card).join('')}</div>`;}
 document.querySelector('#fmap').innerHTML=html;
 for(const b of document.querySelectorAll('[data-fa]'))b.setAttribute('aria-pressed',String(b.dataset.fa===area));
}

function about(){showDialog(`<span class="kicker">이 페이지에 대하여</span><h2>연구 좌표는 이렇게 쓰세요</h2><p>GIST 환경·에너지공학과 전공설명회에 맞춰 만든 전공 탐색 페이지예요. 아직 전공을 정하지 않은 학생도, 다른 학과 학생도 써 볼 수 있어요.</p><p>답을 따라 질문이 바뀌는 7단계 탐색이에요. 기후·대기, 물, 생태, 에너지와 함께 AI·데이터, 측정·현장 조사를 다루고, 고른 주제와 이어지는 교수님과 수업을 보여드려요. 교수님 연결은 학과·연구실 홈페이지의 공개 소개(${FACULTY_CHECKED} 확인)로 만들었어요.</p><p>이름·학번·연락처는 받지 않고, 답은 서버로 보내지 않아요. 행사 정보는 2026년 학과 전공설명회 계획 기준이니 세부 사항은 학과 공지를 확인해 주세요.</p>${curLang()!=='ko'?'<p>이 언어판은 한국어 원문을 옮긴 것이에요. 내용이 서로 다르면 한국어판이 기준이에요. 교수님 이름은 학과 영문 홈페이지 표기를 따랐어요.</p>':''}<p><button class="link" data-action="clear">처음부터 다시</button></p>`);}
function explore(id){const a=areaById(id);if(!a)return;showDialog(`<span class="kicker">출발점 ${a.code} · ${a.group.replace(' 출발하기','')}</span><h2>${a.name}</h2><p>${a.description}</p><div class="chips">${TOPICS[id].map(t=>`<span class="chip">${t.name}</span>`).join('')}</div><p>${a.connections}</p><ul>${a.questions.map(q=>`<li>${q}</li>`).join('')}</ul><p style="margin-top:18px"><button class="pill" data-action="start">이 관심으로 시작 →</button></p>`);}
async function save(blob,name){
 if(window.claude&&typeof window.claude.use==='function'){let d=null;try{d=await window.claude.use('downloads');}catch{}if(!d)return 'unavailable';try{await d.save({filename:name,data:blob});return 'saved';}catch(e){return e&&e.code==='declined'?'declined':'unavailable';}}
 const u=URL.createObjectURL(blob);const l=document.createElement('a');l.href=u;l.download=name;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),30000);return 'saved';
}

function shareLink(){const base=location.protocol==='file:'?location.href.split('#')[0].split('?')[0]:location.origin+location.pathname;copy(base+(curLang()!=='ko'?'?lang='+curLang():''),'처음 화면 링크를 복사했어요.');}
function wrap(ctx,t,w){const L=[];let l='';const toks=/\s/.test(t)&&!/[\u1780-\u17ff]/.test(t)?t.split(/(\s+)/):[...t];for(const ch of toks){if(ctx.measureText(l+ch).width>w&&l.trim()){L.push(l.trim());l=ch.trim();}else l+=ch;}if(l.trim())L.push(l.trim());return L;}
async function card(){
 if(!current)return;const r=current;const a=r.area;
 if(document.fonts?.ready)await document.fonts.ready;
 const c=document.createElement('canvas');c.width=1080;c.height=1350;const x=c.getContext('2d');
 const SERIF='"Gowun Batang","Nanum Myeongjo",serif',SANS='"Pretendard","IBM Plex Sans KR","Noto Sans KR",sans-serif';
 x.fillStyle='#f5f7f2';x.fillRect(0,0,1080,1350);
 x.strokeStyle='#cfe0d4';x.lineWidth=2;
 for(let k=0;k<9;k++){x.beginPath();for(let i=0;i<=90;i++){const t=i/90*Math.PI*2;const rr=60+k*46+Math.sin(3*t+k*.6)*(8+k*2)+Math.cos(5*t)*6;const px=820+Math.cos(t)*rr*1.2,py=380+Math.sin(t)*rr*.8;i?x.lineTo(px,py):x.moveTo(px,py);}x.closePath();x.stroke();}
 x.fillStyle='#1f6e47';x.beginPath();x.arc(820,380,22,0,Math.PI*2);x.fill();x.fillStyle='#fff';x.beginPath();x.arc(820,380,9,0,Math.PI*2);x.fill();
 x.fillStyle='#1b2a21';x.font=`700 30px ${SANS}`;x.fillText(TX('GIST 환경·에너지공학과'),80,110);
 x.fillStyle='#1f6e47';x.font=`600 26px ${SANS}`;x.fillText(TX('나의 연구 좌표'),80,156);
 x.fillStyle='#4b5c51';x.font=`500 28px ${SANS}`;x.fillText(TX(`출발점 ${a.code} · ${a.name}`),80,560);
 x.fillStyle='#1b2a21';x.font=`700 68px ${SERIF}`;let y=660;for(const l of wrap(x,TX(r.topic.name),920)){x.fillText(l,80,y);y+=90;}
 y=Math.max(y+20,820);x.fillStyle='#4b5c51';x.font=`500 28px ${SANS}`;x.fillText(TX('첫 접근')+'  '+TX(methodById(r.ways[0]).name),80,y);x.fillText(TX('막혔을 때')+'  '+TX(methodById(r.ways[r.ways.length-1]).name),80,y+48);
 x.fillStyle='#1f6e47';x.fillRect(0,1080,1080,270);
 x.fillStyle='#fff';x.font=`700 34px ${SANS}`;for(const [i,l] of wrap(x,TX(EVENT.title),920).entries())x.fillText(l,80,1150-(i?0:0)+i*40);
 x.font=`26px ${SANS}`;EVENT.sessions.forEach((s,i)=>x.fillText(`${s.date.replace(/\s*\S+$/,'')} (${TX(s.date.split(' ').pop()+'요일')}) ${s.time} · ${TX(s.place)}`,80,1230+i*44));
 const blob=await new Promise(res=>c.toBlob(res,'image/png'));if(!blob){toast(TX('저장하지 못했어요. 화면을 캡처해 주세요.'));return;}
 const st=await save(blob,curLang()==='ko'?'GIST_환경에너지_나의_연구좌표.png':'GIST_EEE_my_research_coordinate.png');if(st==='saved')toast('좌표 카드를 저장했어요.');else if(st!=='declined')toast('이 화면에서는 저장할 수 없어요. 화면을 캡처해 주세요.');
}
function reset(){answers={};selected=null;qi=0;current=null;if(dialog.open)dialog.close();if(location.hash)try{history.replaceState(null,'',location.pathname+location.search)}catch{}landing();}
document.addEventListener('click',async e=>{
 const ch=e.target.closest('[data-choice]');if(ch){selected=ch.dataset.choice;for(const b of document.querySelectorAll('[data-choice]'))b.setAttribute('aria-pressed',String(b===ch));document.querySelector('[data-action="next"]').disabled=false;return;}
 const fa=e.target.closest('[data-fa]');if(fa){renderFaculty(fa.dataset.fa);return;}
 const ct=e.target.closest('[data-ct]');if(ct){renderTree(ct.dataset.ct);return;}
 const fd=e.target.closest('[data-field]');if(fd){explore(fd.dataset.field);return;}
 const g=e.target.closest('[data-goal]');if(g&&current){answers.goal=g.dataset.goal;current.profile.goal=answers.goal;renderNext(current.profile);return;}
 if(e.target.closest('.brand')){e.preventDefault();reset();scrollTo(0,0);return;}
 if(e.target.closest('.top-event')){e.preventDefault();showDialog(eventBlock(true));return;}
 if(e.target.closest('.x')){dialog.close();return;}
 if(e.target.closest('#about')){about();return;}
 const act=e.target.closest('[data-action]')?.dataset.action;if(!act)return;
 if(act==='start'){if(dialog.open)dialog.close();answers={};selected=null;goQuiz(0);scrollTo(0,0);}
 else if(act==='next'){const q=getQuestion(qi,answers);if(!selected||!q.options.some(o=>o.id===selected))return;answers=setAnswer(answers,q.id,selected);if(qi===QUESTIONS.length-1){location.hash='result';renderResult(assess(answers));}else goQuiz(qi+1);scrollTo(0,0);}
 else if(act==='back'){if(qi===0)reset();else goQuiz(qi-1);scrollTo(0,0);}
 else if(act==='restart'){answers={};goQuiz(0);scrollTo(0,0);}
 else if(act==='clear'){reset();toast('처음 화면으로 돌아왔어요.');scrollTo(0,0);}
 else if(act==='revise')goQuiz(2);
 else if(act==='calendar')await calendar();
 else if(act==='copy-event')copy(eventText(),'일정을 복사했어요.');
 else if(act==='share')shareLink();
 else if(act==='download')await card();
 else if(act==='copy-questions')copy(asks(current).map(TX).join('\n'),'질문을 복사했어요.');
});

<script>/* 살아 있는 화면(2026-11-09): 화면 그리기 코드는 그대로 두고, 그려진 뒤에 움직임만 덧붙인다. */
(()=>{
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const NS='http://www.w3.org/2000/svg';
const PIN={climate:[300,52],ai:[96,64],analysis:[150,122],water:[80,196],ecology:[196,240],energy:[322,214],circular:[336,158]};
const LINKS=[['climate','ai'],['ai','analysis'],['analysis','water'],['water','ecology'],['ecology','energy'],['energy','circular'],['circular','climate'],['analysis','ecology'],['analysis','circular']];
const TOUR=['climate','circular','energy','ecology','water','analysis','ai'];
let uid=0;
const mk=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;};
function seg(a,b,k=.2){const[x1,y1]=PIN[a],[x2,y2]=PIN[b];const dx=x2-x1,dy=y2-y1;return `Q${((x1+x2)/2-dy*k).toFixed(1)} ${((y1+y2)/2+dx*k).toFixed(1)} ${x2} ${y2}`;}
function liven(svg){
 if(svg.__alive||!svg.querySelector('.pin'))return;svg.__alive=1;
 const isRes=!!svg.closest('.coord');const on=svg.querySelector('.pin.on');const act=on&&on.dataset.field;
 svg.querySelectorAll('path.c').forEach((p,i)=>{p.setAttribute('pathLength','100');p.style.setProperty('--i',i);});
 const first=svg.querySelector('.pin');
 const g=mk('g',{class:'links','aria-hidden':'true'});
 const pairs=isRes&&act?Object.keys(PIN).filter(k=>k!==act).map(k=>[act,k]):LINKS;
 pairs.forEach(([a,b],i)=>{if(!PIN[a]||!PIN[b])return;const p=mk('path',{d:`M${PIN[a][0]} ${PIN[a][1]} `+seg(a,b),class:'lk',pathLength:'100'});p.style.setProperty('--i',i);g.appendChild(p);});
 svg.insertBefore(g,first);
 svg.querySelectorAll('.pin').forEach((pin,i)=>{const r=mk('circle',{class:'p',r:'11','aria-hidden':'true'});pin.style.setProperty('--i',i);pin.insertBefore(r,pin.firstChild);});
 if(!RM&&!isRes){
  const id='eee-tour-'+(++uid);let d=`M${PIN[TOUR[0]][0]} ${PIN[TOUR[0]][1]} `;
  for(let i=0;i<TOUR.length;i++)d+=seg(TOUR[i],TOUR[(i+1)%TOUR.length],.16)+' ';
  const path=mk('path',{id,d,fill:'none',stroke:'none'});
  const tg=mk('g',{'aria-hidden':'true'});
  const glow=mk('circle',{r:'8',class:'trav-g'}),dot=mk('circle',{r:'3.2',class:'trav'});
  for(const c of [glow,dot]){const am=mk('animateMotion',{dur:'26s',repeatCount:'indefinite',begin:'2.2s',rotate:'auto'});const mp=mk('mpath',{});mp.setAttributeNS('http://www.w3.org/1999/xlink','xlink:href','#'+id);mp.setAttribute('href','#'+id);am.appendChild(mp);c.appendChild(am);c.setAttribute('cx','-50');tg.appendChild(c);}
  svg.insertBefore(path,first);svg.insertBefore(tg,first);
 }
 svg.classList.add('alive');
}
const SEL='.sec-head,.start,.flow li,.ticket,.fcard,.ask,.sv,.cgrid>div,.tcol,.ns>div,.career>div,.r-actions,.cards>.card,.more,.qline,.try';
const io=(!RM&&'IntersectionObserver' in window)?new IntersectionObserver(es=>{let n=0;es.filter(e=>e.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top||a.boundingClientRect.left-b.boundingClientRect.left).forEach(e=>{const t=e.target;t.style.setProperty('--d',Math.min(n++,9)*70+'ms');t.classList.add('in');io.unobserve(t);t.addEventListener('animationend',()=>{t.classList.remove('rv','in');t.style.removeProperty('--d');},{once:true});});},{threshold:.08,rootMargin:'0px 0px -5% 0px'}):null;
function scan(){
 const main=document.querySelector('main');if(!main)return;
 main.querySelectorAll('.map svg,.coord .r svg').forEach(liven);
 if(io)main.querySelectorAll(SEL).forEach(el=>{if(el.__rv)return;el.__rv=1;el.classList.add('rv');io.observe(el);});
}
let q=0;const kick=()=>{if(q)return;q=requestAnimationFrame(()=>{q=0;scan();});};
const main=document.querySelector('main');
if(main){new MutationObserver(kick).observe(main,{childList:true,subtree:true});}
scan();
})();
</script>
